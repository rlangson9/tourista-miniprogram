<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tourista AR · 管理后台</title>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="login-screen">
  <div class="login-card">
    <div class="login-brand">Tourista AR</div>
    <div class="login-sub">管理后台 · Management Console</div>
    <div class="login-form">
      <label>用户名 Username</label>
      <input id="loginUser" type="text" placeholder="admin" autocomplete="username"/>
      <label>密码 Password</label>
      <input id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password"/>
      <button id="loginBtn" class="btn btn-primary btn-block">登录 Sign In</button>
      <div id="loginError" class="login-error"></div>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app" class="app hidden">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="side-brand">Tourista AR</div>
    <nav class="side-nav">
      <a class="nav-item active" data-view="overview"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg></span>概览 Overview</a>
      <a class="nav-item" data-view="trips"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg></span>行程管理 Trips</a>
      <a class="nav-item" data-view="orders"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V7a3 3 0 0 1 6 0v4"/><rect x="5" y="11" width="14" height="10" rx="2"/></svg></span>订单管理 Orders</a>
      <a class="nav-item" data-view="partners"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M20 8v6M23 11h-6"/></svg></span>合作申请 Partners</a>
      <a class="nav-item" data-view="stories"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg></span>成功案例 Stories</a>
      <a class="nav-item" data-view="opportunities"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg></span>非洲商机 Opportunities</a>
      <a class="nav-item" data-view="inquiries"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></span>用户咨询 Inquiries</a>
      <a class="nav-item" data-view="notifications"><span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span>客户通知 Notify</a>
    </nav>
    <div class="side-foot">
      <div id="sideUser" class="side-user"></div>
      <a id="logoutBtn" class="side-logout">退出登录 Logout</a>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div id="view" class="view"><!-- rendered by app.js --></div>
  </main>
</div>

<!-- Modal -->
<div id="modal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-head">
      <div id="modalTitle" class="modal-title"></div>
      <button id="modalClose" class="modal-close">×</button>
    </div>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
